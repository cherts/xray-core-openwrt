name: Build feed

on:
  workflow_dispatch:
    inputs:
      owrt_version:
        description: 'Select OpenWRT version'
        type: choice
        required: true
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6
          - 24.10.7
          - 24.10.8
  release:
    types:
      - published

permissions:
  contents: write

env:
  PACKAGE_NAME_1: xray-core
  PACKAGE_NAME_2: xray-geodata-cut
  FEED_NAME: xray_core
  OPENWRT_MAJOR: $(echo ${{ inputs.owrt_version }} | cut -d'.' -f1-2)
  OPENWRT_VERSION: ${{ inputs.owrt_version }}

jobs:
  build:
    name: Build openwrt-${{ env.OPENWRT_MAJOR }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - arch: aarch64_cortex-a53
            runtime_test: false
          - arch: aarch64_cortex-a72
            runtime_test: false
          - arch: aarch64_cortex-a76
            runtime_test: false
          - arch: aarch64_generic
            runtime_test: true
          - arch: arm_arm1176jzf-s_vfp
            runtime_test: false
          - arch: arm_arm926ej-s
            runtime_test: false
          - arch: arm_cortex-a15_neon-vfpv4
            runtime_test: true
          - arch: arm_cortex-a5_vfpv4
            runtime_test: false
          - arch: arm_cortex-a7
            runtime_test: false
          - arch: arm_cortex-a7_neon-vfpv4
            runtime_test: false
          - arch: arm_cortex-a8_vfpv3
            runtime_test: false
          - arch: arm_cortex-a9
            runtime_test: false
          - arch: arm_cortex-a9_neon
            runtime_test: false
          - arch: arm_cortex-a9_vfpv3-d16
            runtime_test: false
          - arch: arm_fa526
            runtime_test: false
          - arch: arm_xscale
            runtime_test: false
          - arch: i386_pentium-mmx
            runtime_test: true
          - arch: i386_pentium4
            runtime_test: false
          - arch: loongarch64_generic
            runtime_test: false
          - arch: mips64_mips64r2
            runtime_test: false
          - arch: mips64_octeonplus
            runtime_test: false
          - arch: mips64el_mips64r2
            runtime_test: false
          - arch: mips_24kc
            runtime_test: true
          - arch: mips_4kec
            runtime_test: false
          - arch: mips_mips32
            runtime_test: false
          - arch: mipsel_24kc
            runtime_test: false
          - arch: mipsel_24kc_24kf
            runtime_test: false
          - arch: mipsel_74kc
            runtime_test: false
          - arch: mipsel_mips32
            runtime_test: false
          - arch: riscv64_riscv64
            runtime_test: false
          - arch: x86_64
            runtime_test: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}-openwrt-${{ env.OPENWRT_MAJOR }}
          FEEDNAME: ${{ env.FEED_NAME }}
          PACKAGES: ${{ env.PACKAGE_NAME_1 }}
          NO_REFRESH_CHECK: 1
          INDEX: 1
          KEY_BUILD: ${{ secrets.USIGN_KEY }}
          V: s

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull 2>/dev/null || true
          git checkout ${{ env.OPENWRT_VERSION }} && git pull 2>/dev/null || git checkout -b ${{ env.OPENWRT_VERSION }} 2>/dev/null; rm -rf "${{ env.PACKAGE_NAME_1 }}" 2>/dev/null; rm -rf "${{ env.PACKAGE_NAME_2 }}" 2>/dev/null; rm -rf ".github" 2>/dev/null
          mkdir "${{ matrix.arch }}" 2>/dev/null || true
          for PKG in $(ls -L1 "./bin/packages/${{ matrix.arch }}" 2>/dev/null); do cp ./bin/packages/${{ matrix.arch }}/${PKG}/* ${{ matrix.arch }}/ 2>/dev/null || true; done
          git add . 2>/dev/null || true
          git commit -m "Add binary openwrt-${{ env.OPENWRT_VERSION }}/${{ matrix.arch }} via workflow"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.CUSTOM_TOKEN }}
          branch: ${{ env.OPENWRT_VERSION }}

      - name: Store packages
        uses: actions/upload-artifact@v6
        if: github.event_name != 'release'
        with:
          name: ${{ matrix.arch }}-${{ github.sha }}-packages
          path: |
            Packages
            Packages.*
            *.ipk

      - name: Store logs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.arch }}-${{ github.sha }}-logs
          path: logs/

      - name: Remove logs and other
        run: |
          sudo rm -rf ./logs 2>/dev/null || true
          sudo rm -rf ./bin 2>/dev/null || true
